// ===== AUDIO SYSTEM =====
const muteBtn = document.getElementById('muteBtn');
let isMuted = true;
let audioElements = [];

function initAudio() {
    const sounds = [
        { src: 'sounds/from-the-crypt-ext v2.mp3', volume: 0.5 }
    ];
    sounds.forEach(sound => {
        const audio = new Audio(sound.src);
        audio.volume = sound.volume;
        audio.loop = true;
        audio.muted = true;
        audioElements.push(audio);
    });

    // Unmute on first user interaction
    document.addEventListener('click', function unmuteAudio() {
        if (!isMuted) {
            audioElements.forEach(audio => {
                audio.muted = false;
                audio.play().catch(e => console.log('Audio play failed'));
            });
            isMuted = false;
            muteBtn.textContent = "🔊 Mute Sounds";
        }
        document.removeEventListener('click', unmuteAudio);
    }, { once: true });
}

muteBtn.addEventListener('click', function() {
    isMuted = !isMuted;
    audioElements.forEach(audio => {
        audio.muted = isMuted;
    });
    muteBtn.textContent = isMuted ? "🔈 Unmute Sounds" : "🔊 Mute Sounds";
});

// ===== SITE TITLE HIDE ON SCROLL =====
const siteTitle = document.getElementById('siteTitle');
let lastScrollTop = 0;

window.addEventListener('scroll', function() {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    if (scrollTop > lastScrollTop && scrollTop > 50) {
        siteTitle.classList.add('hidden');
    } else {
        siteTitle.classList.remove('hidden');
    }
    lastScrollTop = scrollTop;
});

// ===== PAGE INITIALISATION =====
document.addEventListener('DOMContentLoaded', function() {
    // Show first poem only
    const poems = document.querySelectorAll('.featured-poem');
    poems.forEach((poem, index) => {
        poem.style.display = index === 0 ? 'block' : 'none';
    });

    // Keyboard navigation for cards
    document.addEventListener('keydown', function(event) {
        if (event.key === 'ArrowLeft') scrollCards(-1);
        if (event.key === 'ArrowRight') scrollCards(1);
    });

    // Video protection (for any videos added later)
    (function protectVideos() {
        document.querySelectorAll('video').forEach(video => {
            video.setAttribute('controlslist', 'nodownload');
            video.addEventListener('contextmenu', (e) => e.preventDefault());
            video.addEventListener('dragstart', (e) => e.preventDefault());
        });
        document.addEventListener('keydown', (e) => {
            const isVideo = e.target.tagName === 'VIDEO' || e.target.closest('video');
            if (isVideo && (e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'c' || e.key === 'C')) {
                e.preventDefault();
            }
        });
    })();
